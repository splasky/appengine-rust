name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-gnu
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.use-cross }}
        run: cargo install cross

      - name: Build (cross)
        if: ${{ matrix.use-cross }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cp LICENSE README.md target/${{ matrix.target }}/release/
          tar czf appengine-rust-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release \
            appengine-rust LICENSE README.md

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cp LICENSE README.md target/${{ matrix.target }}/release/
          tar -czf appengine-rust-${{ matrix.target }}.tar.gz `
            -C target/${{ matrix.target }}/release `
            appengine-rust.exe LICENSE README.md

      - uses: actions/upload-artifact@v4
        with:
          name: appengine-rust-${{ matrix.target }}
          path: appengine-rust-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - run: |
          sha256sum *.tar.gz *.zip > checksums.txt 2>/dev/null || true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
            checksums.txt
