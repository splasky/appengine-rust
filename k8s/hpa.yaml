apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: appengine-rust-hpa
  labels:
    app: appengine-rust
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: appengine-rust
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
