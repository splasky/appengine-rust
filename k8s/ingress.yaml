apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: appengine-rust-ingress
  labels:
    app: appengine-rust
spec:
  rules:
  - host: appengine-rust.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: appengine-rust-service
            port:
              number: 80
